# FenrirOS syslinux config for the live ISO (BIOS).
# %ARCHISO_LABEL% and %INSTALL_DIR% are filled in by mkarchiso.
UI menu.c32
MENU TITLE FenrirOS Live
DEFAULT fenriros
PROMPT 0
TIMEOUT 50

LABEL fenriros
    MENU LABEL FenrirOS - Unchained
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=10G

LABEL fenriros-ram
    MENU LABEL FenrirOS - Unchained (copy to RAM)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=10G copytoram

LABEL fenriros-nomodeset
    MENU LABEL FenrirOS - Unchained (safe graphics)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=10G nomodeset

ONTIMEOUT fenriros
