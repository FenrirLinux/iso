# Answers for a hands-off test install in a virtual machine:
#   fenrir-install -c /usr/share/fenrir/examples/vm-test.conf
#
# WARNING: this ERASES /dev/vda without asking. /dev/vda is the virtual disk
# in QEMU/virt-manager; real computers don't have one.
DISK=/dev/vda
FILESYSTEM=btrfs
SWAP_GB=2
PROFILE=desktop
HOSTNAME=fenrir-vm
USERNAME=test
TIMEZONE=UTC
LOCALE=en_US.UTF-8
KEYMAP=us
NVIDIA=no
CONFIRM=yes
