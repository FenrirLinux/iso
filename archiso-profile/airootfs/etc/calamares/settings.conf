# FenrirOS Calamares settings
# /etc/calamares/settings.conf
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Everything FenrirOS-specific (live cleanup, kernels/initramfs, NVIDIA,
# OpenRC services, GRUB for UEFI and BIOS) lives in one script,
# /usr/local/bin/fenrir-postinstall, run by the shellprocess module.
# It runs before removeuser/users so the users module creates the real
# account (and sudoers entry) on an already-cleaned system.
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - fstab
    - locale
    - keyboard
    - localecfg
    - shellprocess
    - removeuser
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - preservefiles
    - umount
  - show:
    - finished

branding: fenriros

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
