# FenrirOS users module
---
defaultGroups:
    - audio
    - video
    - wheel
    - storage
    - optical
    - input
    - network
    - name: gamemode
      must_exist: false
      system: true

# Root stays locked (fenrir-postinstall locks it); admin access is via sudo.
setRootPassword: false
doReusePassword: false

# The users module writes /etc/sudoers.d/10-installer for this group
# (password required, unlike the live session).
sudoersGroup: wheel

autologinGroup: autologin
doAutologin: false

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "fenrir-${product}"

passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

avatarFilePath: ~/.face
