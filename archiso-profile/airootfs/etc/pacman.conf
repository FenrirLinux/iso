#
# Fenrir Linux - /etc/pacman.conf
#
# Shipped on the live ISO and copied to installed systems.
# Same repo order as the build: Artix first, Arch as fallback,
# CachyOS last (kernel, scx, NVIDIA modules).
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
IgnorePkg   = dinit dinit-userservices s6 s6-rc runit

# --- Artix ---
[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

[lib32]
Include = /etc/pacman.d/mirrorlist

# --- Arch (from artix-archlinux-support) ---
[extra]
Include = /etc/pacman.d/mirrorlist-arch

[multilib]
Include = /etc/pacman.d/mirrorlist-arch

# --- CachyOS ---
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
