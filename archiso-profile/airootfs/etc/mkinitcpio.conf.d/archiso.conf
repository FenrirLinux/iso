# Fenrir Linux - mkinitcpio config for the LIVE ISO only.
# Used through archiso_config in /etc/mkinitcpio.d/linux-cachyos.preset.
# The installer deletes this file and writes a normal preset.
#
# No autodetect: the live image has to boot on any hardware.
MODULES=(ahci ata_piix libata sr_mod cdrom iso9660 squashfs loop overlay virtio virtio_pci virtio_blk usb_storage uas usbhid ehci_hcd ehci_pci xhci_hcd xhci_pci nvme)
BINARIES=()
FILES=()
HOOKS=(base fenrir-udev modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
