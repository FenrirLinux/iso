# FenrirOS GRUB config for the live ISO (UEFI).
# %ARCHISO_LABEL% and %INSTALL_DIR% are filled in by mkarchiso.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_output gfxterm
fi

set default=fenriros
set timeout=5
set timeout_style=menu

menuentry "FenrirOS - Unchained" --class fenriros --class gnu-linux --id fenriros {
    set gfxpayload=keep
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=10G
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "FenrirOS - Unchained (copy to RAM)" --class fenriros --class gnu-linux --id fenriros-ram {
    set gfxpayload=keep
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=10G copytoram
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "FenrirOS - Unchained (safe graphics)" --class fenriros --class gnu-linux --id fenriros-nomodeset {
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=10G nomodeset
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id uefi-firmware {
        fwsetup
    }
fi

menuentry 'Reboot' --class reboot {
    reboot
}

menuentry 'Power off' --class shutdown {
    halt
}
