# FenrirOS GRUB loopback config.
# Used when the ISO file itself is booted from another GRUB
# (Ventoy GRUB2 mode, Super GRUB2 Disk, a "loopback" entry in grub.cfg).
# https://www.supergrubdisk.org/wiki/Loopback.cfg

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

set default=fenriros
set timeout=5
set timeout_style=menu

menuentry "FenrirOS - Unchained" --class fenriros --class gnu-linux --id fenriros {
    set gfxpayload=keep
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=10G
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "FenrirOS - Unchained (safe graphics)" --class fenriros --class gnu-linux --id fenriros-nomodeset {
    linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=10G nomodeset
    initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}
