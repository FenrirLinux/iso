#
# Fenrir Linux - pacman.conf used by mkarchiso to BUILD the ISO
#
# Signature checking is on. The build host needs the Artix, Arch and
# CachyOS keys in its keyring; ./build.sh takes care of that.
#
# Repo order matters: Artix repos come first so their systemd-free
# builds win over Arch's. CachyOS is last so it only supplies what
# nobody else has (the kernel, scx, keyring) instead of replacing
# Artix packages with systemd-linked CachyOS builds.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
IgnorePkg   = dinit dinit-userservices s6 s6-rc runit

# --- Artix ---
[system]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch
Server = https://mirror.pascalpuffke.de/artix-linux/$repo/os/$arch

[world]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch
Server = https://mirror.pascalpuffke.de/artix-linux/$repo/os/$arch

[galaxy]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch
Server = https://mirror.pascalpuffke.de/artix-linux/$repo/os/$arch

[lib32]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch
Server = https://mirror.pascalpuffke.de/artix-linux/$repo/os/$arch

# --- Arch (fallback for anything Artix doesn't carry) ---
[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

# --- CachyOS (kernel, scx schedulers, NVIDIA modules) ---
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo
